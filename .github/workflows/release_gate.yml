name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: TDS identity: 24f2007918@ds.study.iitm.ac.in
        run: echo "TDS identity verified"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test release gate
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()

          payload = {
              "target": "preview",
              "event": "pull_request",
              "ref": "refs/heads/feature",
              "workflow": {
                  "trigger": "pull_request",
                  "permissions": {
                      "contents": "read",
                      "packages": "write",
                      "id-token": "none"
                  },
                  "testsPassed": True,
                  "matrixComplete": True,
                  "failFast": False,
                  "actions": [
                      {
                          "owner": "actions",
                          "name": "checkout",
                          "ref": "v4"
                      },
                      {
                          "owner": "docker",
                          "name": "build-push-action",
                          "ref": "0123456789abcdef0123456789abcdef01234567"
                      }
                  ]
              },
              "image": {
                  "multiStage": True,
                  "runsAsRoot": False,
                  "secretMode": "none",
                  "criticalVulnerabilities": 0,
                  "digestPinned": True
              }
          }

          response = client.post("/release-gate", json=payload)

          assert response.status_code == 200

          result = response.get_json()

          print(result)

          assert result["decision"] == "promote"
          assert result["violations"] == []
          PY
